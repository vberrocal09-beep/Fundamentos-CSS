<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mi Cafetería</title>

</head>

<body>

    <!-- Título principal de la cafetería -->
    <h1 id="titulo">Mi Cafetería</h1>

    <!-- Eslogan -->
    <p class="eslogan">Los mejores cafés de la ciudad</p>

    <!-- Sección del menú -->
    <h2>Menú</h2>

    <ul>
        <li class="producto">Espresso</li>
        <li class="producto">Capuchino</li>
        <li class="producto">Latte</li>
    </ul>

    <!-- Información sobre la cafetería -->
    <h2>Sobre nosotros</h2>

    <p>
        Somos una cafetería <strong>familiar</strong>
        con café <em>100% natural</em>.
    </p>

    <!-- Promoción -->
    <p class="destacado">Hoy: 2x1 en capuchinos.</p>

    <!-- Información de contacto -->
    <h2>Contacto</h2>

    <p>
        Visita nuestra
        <a href="#">página web</a>.
    </p>

    <!-- Pie de página -->
    <p id="pie">2026 Mi Cafetería</p>

</body>
</html>
